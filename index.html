<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>PRODX POS — Retail Operating System</title>
    <meta name="description" content="Production-grade Point of Sale frontend foundation featuring modular architecture, decimal-safe financial calculations, offline resilience, and enterprise design system." />
    <meta property="og:title" content="PRODX POS — Retail Operating System" />
    <meta property="og:description" content="Production-grade Point of Sale frontend foundation featuring modular architecture, decimal-safe financial calculations, offline resilience, and enterprise design system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var PRESETS = {
            enterprise_obsidian: {
              primary: '#FF8A00', primaryDark: '#E67A00', primaryLight: 'rgba(255, 138, 0, 0.12)', primaryGlow: 'rgba(255, 138, 0, 0.25)',
              background: '#1F1F1F', card: '#111113', cardHover: '#202023', text: '#FAFAFA', textMuted: '#A1A1AA', border: '#2A2A2A', borderHover: '#3A3A3A',
              buttonRadius: '12px', cardRadius: '16px', isDark: true
            },
            nordic_slate: {
              primary: '#FF8A00', primaryDark: '#E67A00', primaryLight: 'rgba(255, 138, 0, 0.08)', primaryGlow: 'rgba(255, 138, 0, 0.18)',
              background: '#F7EDE2', card: '#FFFFFF', cardHover: '#F2E4D5', text: '#1F1F1F', textMuted: '#6B625A', border: '#E7D7C6', borderHover: '#D7C0A8',
              buttonRadius: '12px', cardRadius: '16px', isDark: false
            },
            royal_emerald: {
              primary: '#059669', primaryDark: '#047857', primaryLight: 'rgba(5, 150, 105, 0.09)', primaryGlow: 'rgba(5, 150, 105, 0.22)',
              background: '#F4FBF7', card: '#FFFFFF', cardHover: '#ECFDF5', text: '#064E3B', textMuted: '#047857', border: '#D1FAE5', borderHover: '#A7F3D0',
              buttonRadius: '14px', cardRadius: '18px', isDark: false
            },
            cyberpunk_neon: {
              primary: '#06B6D4', primaryDark: '#0891B2', primaryLight: 'rgba(6, 182, 212, 0.14)', primaryGlow: 'rgba(6, 182, 212, 0.35)',
              background: '#0B0F19', card: '#111827', cardHover: '#1F2937', text: '#F9FAFB', textMuted: '#9CA3AF', border: '#1F2937', borderHover: '#374151',
              buttonRadius: '10px', cardRadius: '14px', isDark: true
            },
            sunset_terracotta: {
              primary: '#EA580C', primaryDark: '#C2410C', primaryLight: 'rgba(234, 88, 12, 0.09)', primaryGlow: 'rgba(234, 88, 12, 0.2)',
              background: '#FFFBF7', card: '#FFFFFF', cardHover: '#FFF7ED', text: '#431407', textMuted: '#9A3412', border: '#FFEDD5', borderHover: '#FED7AA',
              buttonRadius: '16px', cardRadius: '20px', isDark: false
            },
            midnight_indigo: {
              primary: '#6366F1', primaryDark: '#4F46E5', primaryLight: 'rgba(99, 102, 241, 0.13)', primaryGlow: 'rgba(99, 102, 241, 0.28)',
              background: '#0A0A14', card: '#13132B', cardHover: '#1E1E3F', text: '#F8FAFC', textMuted: '#A5B4FC', border: '#23234A', borderHover: '#3B3B6D',
              buttonRadius: '12px', cardRadius: '16px', isDark: true
            }
          };

          var savedPresetId = localStorage.getItem('prodx_pos_theme_preset') || 'enterprise_obsidian';
          var preset = PRESETS[savedPresetId] || PRESETS.enterprise_obsidian;
          var savedMode = localStorage.getItem('prodx_pos_theme_mode');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          var isDark = false;
          if (savedMode === 'dark') {
            isDark = true;
          } else if (savedMode === 'light') {
            isDark = false;
          } else if (savedMode === 'system') {
            isDark = systemDark;
          } else {
            isDark = preset.isDark;
          }

          var customAccent = localStorage.getItem('prodx_custom_accent_color');
          var root = document.documentElement;

          var bgColor = preset.background;
          var cardColor = preset.card;
          var cardHoverColor = preset.cardHover;
          var textColor = preset.text;
          var textMutedColor = preset.textMuted;
          var borderColor = preset.border;
          var borderHoverColor = preset.borderHover;
          var primaryColor = customAccent || preset.primary;
          var primaryDarkColor = preset.primaryDark;
          var primaryLightColor = preset.primaryLight;
          var primaryGlow = preset.primaryGlow;

          if (isDark) {
            if (preset.isDark) {
              bgColor = preset.background;
              cardColor = preset.card;
              cardHoverColor = preset.cardHover;
              textColor = preset.text;
              textMutedColor = preset.textMuted;
              borderColor = preset.border;
              borderHoverColor = preset.borderHover;
              primaryColor = customAccent || preset.primary;
            } else {
              bgColor = '#1F1F1F';
              cardColor = '#111113';
              cardHoverColor = '#202023';
              textColor = '#FAFAFA';
              textMutedColor = '#A1A1AA';
              borderColor = '#2A2A2A';
              borderHoverColor = '#3A3A3A';
              primaryColor = customAccent || preset.primary;
              primaryDarkColor = '#E67A00';
              primaryLightColor = 'rgba(255, 138, 0, 0.12)';
              primaryGlow = 'rgba(255, 138, 0, 0.25)';
            }
          } else {
            if (!preset.isDark) {
              bgColor = preset.background;
              cardColor = preset.card;
              cardHoverColor = preset.cardHover;
              textColor = preset.text;
              textMutedColor = preset.textMuted;
              borderColor = preset.border;
              borderHoverColor = preset.borderHover;
              primaryColor = customAccent || preset.primary;
            } else {
              bgColor = '#F7EDE2';
              cardColor = '#FFFFFF';
              cardHoverColor = '#F2E4D5';
              textColor = '#1F1F1F';
              textMutedColor = '#6B625A';
              borderColor = '#E7D7C6';
              borderHoverColor = '#D7C0A8';
              primaryColor = customAccent || preset.primary;
              primaryDarkColor = '#E67A00';
              primaryLightColor = 'rgba(255, 138, 0, 0.08)';
              primaryGlow = 'rgba(255, 138, 0, 0.18)';
            }
          }

          root.style.setProperty('--primary-color', primaryColor);
          root.style.setProperty('--primary-dark', primaryDarkColor);
          root.style.setProperty('--primary-light', primaryLightColor);
          root.style.setProperty('--primary-glow', primaryGlow);
          root.style.setProperty('--bg-color', bgColor);
          root.style.setProperty('--card-color', cardColor);
          root.style.setProperty('--card-hover', cardHoverColor);
          root.style.setProperty('--text-color', textColor);
          root.style.setProperty('--text-muted', textMutedColor);
          root.style.setProperty('--border-color', borderColor);
          root.style.setProperty('--border-hover', borderHoverColor);
          root.style.setProperty('--button-radius', preset.buttonRadius);
          root.style.setProperty('--card-radius', preset.cardRadius);

          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
