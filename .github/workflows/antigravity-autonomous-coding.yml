name: Antigravity Autonomous Production Executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: antigravity-autonomous-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Antigravity Pro autonomous production loop
    runs-on: [self-hosted, linux, prodx-antigravity]
    timeout-minutes: 15

    steps:
      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          test -n "${EVENT_PR:-}"
          metadata="$(gh pr view "$EVENT_PR" --repo "$REPO" --json number,state,headRepositoryOwner,headRepository,headRefName,headRefOid,baseRefName)"
          test "$(jq -r '.number' <<<"$metadata")" = "$EVENT_PR"
          test "$(jq -r '.state' <<<"$metadata")" = "OPEN"
          test "$(jq -r '.baseRefName' <<<"$metadata")" = "main"
          head_repo="$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<<"$metadata")"
          test "$head_repo" = "$REPO"
          head_ref="$(jq -r '.headRefName' <<<"$metadata")"
          case "$head_ref" in
            antigravity/*) ;;
            *) echo "Refusing validation for non-Antigravity branch: $head_ref" >&2; exit 1 ;;
          esac
          head_sha="$(jq -r '.headRefOid' <<<"$metadata")"
          test "${#head_sha}" -eq 40
          echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Verify Antigravity Pro account
        run: |
          set -euo pipefail
          command -v agy >/dev/null
          command -v gh >/dev/null
          command -v jq >/dev/null
          test -z "${GEMINI_API_KEY:-}" || {
            echo "GEMINI_API_KEY must not be used by the Pro-account validator." >&2
            exit 1
          }
          agy models
          agy -p "Reply with exactly PRODX_AUTONOMOUS_AUTH_OK" --model gemini-3.5-flash --output-format json --print-timeout 3m > auth-check.json
          jq -e '.status == "SUCCESS" and (.response | contains("PRODX_AUTONOMOUS_AUTH_OK"))' auth-check.json >/dev/null

      - name: Inspect PR without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json number,title,state,body,headRefName,headRefOid,baseRefName,files,commits,reviews,statusCheckRollup > pr.json
          test "$(jq -r '.headRefOid' pr.json)" = "$HEAD_SHA"
          test "$(jq -r '.baseRefName' pr.json)" = "main"
          jq '{number,title,state,headRefName,headRefOid,baseRefName,files,commits,statusCheckRollup}' pr.json > executor-report.json
          echo "Validated PR metadata and checks only."
          echo "No PR-controlled source was checked out or executed."

      - name: Publish validation report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          {
            echo "## Antigravity Production Validator"
            echo
            echo "**PR:** #$PR"
            echo
            echo "This workflow validates PR metadata and checks only."
            echo "PR-controlled source is not checked out or executed in this privileged workflow."
          } > executor-report.md
          gh pr comment "$PR" --repo "$REPO" --body-file executor-report.md
